openapi: 3.1.0
info:
  title: DC Management API
  version: 0.1.0
  description: >
    The single contract between the DC Management backend and its apps.
    The apps' Dart API client is generated from this file.
paths:
  /health:
    get:
      operationId: getHealth
      summary: Check that the API is up
      security: []
      responses:
        "200":
          description: The API is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: The API is running but can't read its database.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthUnavailable"
components:
  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status, database, time]
      properties:
        status:
          type: string
          enum: [ok]
        database:
          description: Whether the API could read the main table.
          type: string
          enum: [ok]
        time:
          description: The server's current time.
          type: string
          format: date-time
    HealthUnavailable:
      type: object
      additionalProperties: false
      required: [status, database]
      properties:
        status:
          type: string
          enum: [unavailable]
        database:
          type: string
          enum: [unavailable]
